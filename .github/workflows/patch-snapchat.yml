name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip tar xz-utils p7zip-full

      - name: Setup Linux iOS toolchain + SDK
        run: |
          set -e
          mkdir -p toolchain sdks

          # Prebuilt Linux -> iOS arm64 toolchain (L1ghtmann)
          echo "Downloading Linux iOS toolchain..."
          curl -L --fail -o toolchain.tar.xz \
            "https://github.com/L1ghtmann/llvm-project/releases/download/v19.0.0-L2/iOSToolchain-x86_64.tar.xz" \
            || curl -L --fail -o toolchain.tar.xz \
            "https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma"

          if file toolchain.tar.xz | grep -q LZMA; then
            tar --lzma -xf toolchain.tar.xz -C toolchain --strip-components=1 || tar -xf toolchain.tar.xz -C toolchain
          else
            tar -xJf toolchain.tar.xz -C toolchain --strip-components=1 || tar -xf toolchain.tar.xz -C toolchain
          fi

          echo "Toolchain contents:"
          find toolchain -type f -name clang | head -5
          ls toolchain/ || true

          # SDK
          echo "Downloading iPhoneOS SDK..."
          curl -L --fail -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk sdks/ || true
          ls sdks/

          # Find clang and SDK
          CLANG=$(find toolchain -type f -name clang | head -n1)
          SDK=$(find sdks -maxdepth 1 -type d -name "iPhoneOS*.sdk" | sort | tail -n1)
          echo "CLANG=$CLANG"
          echo "SDK=$SDK"

          if [ -z "$CLANG" ] || [ -z "$SDK" ]; then
            echo "Failed to locate clang or SDK"
            find toolchain | head -30
            ls -la sdks/
            exit 1
          fi

          echo "CLANG=$CLANG" >> $GITHUB_ENV
          echo "SDK=$SDK" >> $GITHUB_ENV

      - name: Build SecretShot dylib
        run: |
          set -e
          echo "Building with $CLANG and $SDK"

          "$CLANG" -arch arm64 \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -install_name "@executable_path/Frameworks/SecretShot.dylib" \
            -o SecretShot.dylib \
            dylib/SecretShot.m

          ls -la SecretShot.dylib
          file SecretShot.dylib

          SIZE=$(wc -c < SecretShot.dylib | tr -d ' ')
          echo "SIZE=$SIZE"

          if [ "$SIZE" -lt 15000 ]; then
            echo "FATAL: dylib only $SIZE bytes"
            exit 1
          fi

          echo "Dylib OK"

      - name: Download IPA
        run: |
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Inject + rebuild
        run: |
          set -e
          # optool for Linux if available, otherwise use a simple note
          curl -L --fail -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip || true
          unzip -o optool.zip || true
          chmod +x optool || true

          mkdir work && cd work
          7z x ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp ../SecretShot.dylib Payload/Snapchat.app/Frameworks/

          if [ -f ../optool ]; then
            ../optool install -c load \
              -p "@executable_path/Frameworks/SecretShot.dylib" \
              -t Payload/Snapchat.app/Snapchat || echo "optool failed, dylib still placed"
          else
            echo "optool not available on Linux - dylib placed in Frameworks (may need manual load command)"
          fi

          7z a -tzip ../Snapchat-Patched.ipa Payload
          ls -lh ../Snapchat-Patched.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: SecretShot.dylib
          retention-days: 7
