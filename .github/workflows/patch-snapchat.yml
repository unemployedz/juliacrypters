name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox (or any) URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'

      - name: Build screenshot-bypass dylib
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          cd dylib
          # Make sure we have a clean minimal Makefile for jailed/sideload use
          cat > Makefile << 'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = SecretShot
          SecretShot_FILES = Tweak.x
          SecretShot_CFLAGS = -fobjc-arc
          SecretShot_FRAMEWORKS = UIKit
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          make clean || true
          make package FINALPACKAGE=1
          # Find the produced dylib
          find .theos packages -name "*.dylib" -type f 2>/dev/null || true
          DYLIB=$(find .theos -name "SecretShot.dylib" -type f | head -n1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "*.dylib" -type f | head -n1)
          fi
          echo "Found dylib: $DYLIB"
          cp "$DYLIB" $GITHUB_WORKSPACE/SecretShot.dylib
          ls -lh $GITHUB_WORKSPACE/SecretShot.dylib

      - name: Download original IPA
        run: |
          echo "Downloading IPA..."
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Install optool + inject
        run: |
          # Get optool
          curl -L -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip || true
          unzip -o optool.zip || true
          chmod +x optool || true

          mkdir work && cd work
          # Use ditto or unzip (macOS has unzip)
          unzip -q ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp ../SecretShot.dylib Payload/Snapchat.app/Frameworks/

          # Inject LC_LOAD_DYLIB
          if [ -f ../optool ]; then
            ../optool install -c load \
              -p "@executable_path/Frameworks/SecretShot.dylib" \
              -t Payload/Snapchat.app/Snapchat
          else
            echo "optool not available - trying alternative injection note"
            # Fallback: just place the dylib (some loaders / substrate-style will still work if the binary is later patched)
          fi

          # Re-zip
          zip -r ../Snapchat-Patched.ipa Payload
          cd ..
          ls -lh Snapchat-Patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: SecretShot.dylib
          retention-days: 7
