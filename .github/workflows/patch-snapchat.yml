name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox (or any) URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        run: |
          set -e
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS

          mkdir -p $THEOS/sdks
          cd /tmp
          curl -L --fail -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk $THEOS/sdks/
          echo "SDKs installed:"
          ls $THEOS/sdks/

      - name: Build SecretShot dylib (Substrate-free)
        run: |
          set -e
          export THEOS=$GITHUB_WORKSPACE/theos
          cd dylib

          make clean || true
          make package FINALPACKAGE=1

          echo "===== Build outputs ====="
          find .theos -type f -name "*.dylib" -o -name "*.so" 2>/dev/null || true
          ls -la .theos/obj/ 2>/dev/null || true

          DYLIB=$(find .theos -name "SecretShot.dylib" -type f | head -n1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "*.dylib" -type f | head -n1)
          fi

          if [ -z "$DYLIB" ]; then
            echo "ERROR: No dylib produced"
            exit 1
          fi

          echo "Found: $DYLIB"
          ls -lh "$DYLIB"
          file "$DYLIB"

          SIZE=$(stat -f%z "$DYLIB" 2>/dev/null || stat -c%s "$DYLIB")
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: dylib is too small ($SIZE bytes) – build failed"
            exit 1
          fi

          # Verify it's arm64 Mach-O
          if ! file "$DYLIB" | grep -q "arm64"; then
            echo "ERROR: not an arm64 binary"
            file "$DYLIB"
            exit 1
          fi

          cp "$DYLIB" $GITHUB_WORKSPACE/SecretShot.dylib
          ls -lh $GITHUB_WORKSPACE/SecretShot.dylib
          file $GITHUB_WORKSPACE/SecretShot.dylib

      - name: Download original IPA
        run: |
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Inject dylib and rebuild IPA
        run: |
          set -e
          curl -L --fail -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip
          unzip -o optool.zip
          chmod +x optool

          mkdir work && cd work
          unzip -q ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp ../SecretShot.dylib Payload/Snapchat.app/Frameworks/

          ../optool install -c load \
            -p "@executable_path/Frameworks/SecretShot.dylib" \
            -t Payload/Snapchat.app/Snapchat

          # Quick verification that the load command was added
          otool -L Payload/Snapchat.app/Snapchat | grep -i SecretShot || echo "WARNING: load command not visible (optool may have failed)"

          zip -r ../Snapchat-Patched.ipa Payload
          cd ..
          ls -lh Snapchat-Patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: SecretShot.dylib
          retention-days: 7
