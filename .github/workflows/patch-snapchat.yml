name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox (or any) URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SecretShot dylib with clang (strict)
        run: |
          set -ex

          echo "=== Source file ==="
          ls -la dylib/
          cat dylib/SecretShot.m

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          ls "$SDK" | head

          cd dylib

          # Compile with maximum visibility
          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -install_name "@executable_path/Frameworks/SecretShot.dylib" \
            -o SecretShot.dylib \
            SecretShot.m

          echo "=== After clang ==="
          ls -la SecretShot.dylib
          file SecretShot.dylib
          otool -hv SecretShot.dylib || true
          otool -l SecretShot.dylib | head -40 || true

          SIZE=$(stat -f%z SecretShot.dylib)
          echo "SIZE=$SIZE"

          if [ "$SIZE" -lt 30000 ]; then
            echo "FATAL: dylib is only $SIZE bytes – this is not a real binary"
            exit 1
          fi

          if ! file SecretShot.dylib | grep -q "arm64"; then
            echo "FATAL: not arm64"
            exit 1
          fi

          cp -v SecretShot.dylib $GITHUB_WORKSPACE/SecretShot.dylib
          ls -la $GITHUB_WORKSPACE/SecretShot.dylib

      - name: Download original IPA
        run: |
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Inject dylib and rebuild IPA
        run: |
          set -e
          curl -L --fail -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip
          unzip -o optool.zip
          chmod +x optool

          mkdir work && cd work
          unzip -q ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp ../SecretShot.dylib Payload/Snapchat.app/Frameworks/

          ../optool install -c load \
            -p "@executable_path/Frameworks/SecretShot.dylib" \
            -t Payload/Snapchat.app/Snapchat

          echo "=== Load commands ==="
          otool -L Payload/Snapchat.app/Snapchat | grep -i SecretShot || echo "WARNING: load command missing"

          zip -r ../Snapchat-Patched.ipa Payload
          cd ..
          ls -lh Snapchat-Patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: SecretShot.dylib
          retention-days: 7
