name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib (root, absolute, forced checks)
        run: |
          set -e

          echo "PWD=$(pwd)"
          echo "=== Source ==="
          cat dylib/SecretShot.m

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"

          # Build directly into workspace root with absolute output path
          OUT="$GITHUB_WORKSPACE/SecretShot.dylib"

          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -install_name "@executable_path/Frameworks/SecretShot.dylib" \
            -o "$OUT" \
            "$GITHUB_WORKSPACE/dylib/SecretShot.m"

          echo "=== Built file ==="
          ls -la "$OUT"
          file "$OUT"
          otool -hv "$OUT" || true

          SIZE=$(stat -f%z "$OUT")
          echo "SIZE_BYTES=$SIZE"

          # Hard fail - this must stop the job
          if [ "$SIZE" -lt 30000 ]; then
            echo "========================================"
            echo "FATAL: dylib is only $SIZE bytes"
            echo "This is not a usable binary. Stopping."
            echo "========================================"
            exit 1
          fi

          echo "Dylib looks good ($SIZE bytes)"

      - name: Download original IPA
        run: |
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Inject and rebuild
        run: |
          set -e
          curl -L --fail -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip
          unzip -o optool.zip
          chmod +x optool

          mkdir work && cd work
          unzip -q ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp "$GITHUB_WORKSPACE/SecretShot.dylib" Payload/Snapchat.app/Frameworks/

          ../optool install -c load \
            -p "@executable_path/Frameworks/SecretShot.dylib" \
            -t Payload/Snapchat.app/Snapchat

          otool -L Payload/Snapchat.app/Snapchat | grep -i SecretShot || echo "WARNING: load command missing"

          zip -r ../Snapchat-Patched.ipa Payload
          cd ..
          ls -lh Snapchat-Patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: ${{ github.workspace }}/SecretShot.dylib
          retention-days: 7
