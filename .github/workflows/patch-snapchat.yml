name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox (or any) URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid make wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos (manual, reliable)
        run: |
          set -e
          export THEOS=$GITHUB_WORKSPACE/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV

          # Clone Theos
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS

          # Prepare sdks directory
          mkdir -p $THEOS/sdks

          # Download official Theos SDKs
          echo "Downloading SDKs..."
          cd /tmp
          curl -L --fail -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk $THEOS/sdks/ || true
          ls -la $THEOS/sdks/

          # On macOS the Xcode toolchain is already available, so we don't need the Linux toolchain
          echo "Theos ready at $THEOS"

      - name: Build screenshot-bypass dylib
        run: |
          set -e
          export THEOS=$GITHUB_WORKSPACE/theos
          cd dylib

          # Clean Makefile for this environment
          cat > Makefile << 'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = SecretShot
          SecretShot_FILES = Tweak.x
          SecretShot_CFLAGS = -fobjc-arc
          SecretShot_FRAMEWORKS = UIKit
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          make clean || true
          make package FINALPACKAGE=1

          # Locate the dylib
          DYLIB=$(find .theos -name "SecretShot.dylib" -type f | head -n1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "*.dylib" -type f | head -n1)
          fi
          echo "Found dylib: $DYLIB"
          cp "$DYLIB" $GITHUB_WORKSPACE/SecretShot.dylib
          ls -lh $GITHUB_WORKSPACE/SecretShot.dylib
          file $GITHUB_WORKSPACE/SecretShot.dylib

      - name: Download original IPA
        run: |
          echo "Downloading IPA..."
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Inject dylib and rebuild IPA
        run: |
          set -e
          # Get optool
          curl -L --fail -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip
          unzip -o optool.zip
          chmod +x optool

          mkdir work && cd work
          unzip -q ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp ../SecretShot.dylib Payload/Snapchat.app/Frameworks/

          ./../optool install -c load \
            -p "@executable_path/Frameworks/SecretShot.dylib" \
            -t Payload/Snapchat.app/Snapchat

          zip -r ../Snapchat-Patched.ipa Payload
          cd ..
          ls -lh Snapchat-Patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: SecretShot.dylib
          retention-days: 7
