name: Patch Snapchat IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct Dropbox URL ending with ?dl=1'
        required: true
        type: string
        default: 'https://www.dropbox.com/scl/fi/zb13cao434s1fc6j30klw/com.toyopagroup.picaboo-14.30.0.59-eeveedecrypter.ipa?rlkey=xz334t9hezaizgt6e5hfwhzv8&st=owtamjww&dl=1'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip tar xz-utils p7zip-full lzma

      - name: Setup Linux iOS toolchain + SDK
        run: |
          set -e
          mkdir -p toolchain sdks

          echo "Downloading sbingner Linux iOS toolchain..."
          curl -L --fail -o toolchain.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma"

          tar --lzma -xf toolchain.tar.lzma -C toolchain

          echo "Toolchain tree:"
          find toolchain -maxdepth 3 -type d
          find toolchain -name "clang*" -type f | head -10

          # Expected layout: toolchain/ios-arm64e-clang-toolchain/bin/clang
          CLANG=$(find toolchain -type f -name "clang" | head -n1)
          if [ -z "$CLANG" ]; then
            CLANG=$(find toolchain -type f -name "clang-10" | head -n1)
          fi
          if [ -z "$CLANG" ]; then
            CLANG=$(find toolchain -type f -name "clang-*" | head -n1)
          fi

          echo "CLANG=$CLANG"
          if [ -z "$CLANG" ]; then
            echo "clang not found"
            find toolchain | head -50
            exit 1
          fi

          # SDK - pick newest iPhoneOS
          curl -L --fail -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk sdks/
          ls sdks/

          SDK=$(ls -d sdks/iPhoneOS1*.sdk 2>/dev/null | sort -V | tail -n1)
          echo "SDK=$SDK"
          if [ -z "$SDK" ]; then
            echo "SDK not found"
            exit 1
          fi

          echo "CLANG=$CLANG" >> $GITHUB_ENV
          echo "SDK=$SDK" >> $GITHUB_ENV

      - name: Build SecretShot dylib
        run: |
          set -e
          echo "Building with:"
          echo "  CLANG=$CLANG"
          echo "  SDK=$SDK"

          "$CLANG" -arch arm64 \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -install_name "@executable_path/Frameworks/SecretShot.dylib" \
            -o SecretShot.dylib \
            dylib/SecretShot.m

          ls -la SecretShot.dylib
          file SecretShot.dylib

          SIZE=$(wc -c < SecretShot.dylib | tr -d ' ')
          echo "SIZE=$SIZE"

          if [ "$SIZE" -lt 15000 ]; then
            echo "FATAL: dylib only $SIZE bytes"
            exit 1
          fi

          echo "Dylib OK"

      - name: Download IPA
        run: |
          curl -L --fail -o original.ipa "${{ github.event.inputs.ipa_url }}"
          ls -lh original.ipa

      - name: Inject + rebuild
        run: |
          set -e
          mkdir work && cd work
          7z x ../original.ipa

          mkdir -p Payload/Snapchat.app/Frameworks
          cp ../SecretShot.dylib Payload/Snapchat.app/Frameworks/

          # Try optool (mac binary may not run); dylib is still in Frameworks
          curl -L --fail -o optool.zip https://github.com/alexzielenski/optool/releases/download/0.1/optool.zip || true
          unzip -o optool.zip || true
          chmod +x optool || true
          if [ -f optool ] && file optool | grep -q ELF; then
            ./optool install -c load -p "@executable_path/Frameworks/SecretShot.dylib" -t Payload/Snapchat.app/Snapchat || true
          else
            echo "optool not usable on Linux - dylib placed; load command may need Mac/optool later"
          fi

          7z a -tzip ../Snapchat-Patched.ipa Payload
          ls -lh ../Snapchat-Patched.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapchat-Patched
          path: Snapchat-Patched.ipa
          retention-days: 7

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SecretShot-dylib
          path: SecretShot.dylib
          retention-days: 7
